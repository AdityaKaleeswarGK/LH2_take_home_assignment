[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-stack"
version = "0.1.0"
description = "Repository-local Git history and public pull-request ingestion"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aditya Kaleeswar" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[project.scripts]
stress-stack = "stress_stack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
