[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stress-stack"
version = "0.1.0"
description = "Repository-local Git history and public pull-request ingestion"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aditya Kaleeswar" }]
dependencies = [
  # Real grammars for the non-Python knowledge layer. Without these the
  # multi-language parsers fall back to regex, which cannot find a function
  # body's true extent — so excision would cut the wrong lines.
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[project.scripts]
stress-stack = "stress_stack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
